name: Construir APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: if [ -f projeto.zip ]; then unzip -o projeto.zip -d .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZoeDiag.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ZOE Diag ${{ github.run_number }}
          files: ZoeDiag.apk
